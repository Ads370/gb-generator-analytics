version: 2
models:
  - name: mart_operator_period
    description: Operator output and utilisation per settlement period.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - settlement_date
              - settlement_period
              - lead_party_name
    columns:
      - name: lead_party_name
        tests:
          - not_null
      - name: settlement_date
        tests:
          - not_null
      - name: settlement_period
        tests:
          - not_null
      - name: load_factor
        description: Output MW over running capacity MW, expected 0..~1.1.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.2

  - name: mart_fuel_mix
    description: Generation by operator and fuel type per settlement period.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - settlement_date
              - settlement_period
              - lead_party_name
              - fuel_type
              - fuel_output_mwh
    columns:
      - name: settlement_date
        tests:
          - not_null
      - name: settlement_period
        tests:
          - not_null
      - name: lead_party_name
        tests:
          - not_null 
      - name: fuel_type
        tests:
          - not_null
      - name: fuel_output_mwh
        tests:
          - not_null


